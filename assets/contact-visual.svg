<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="contactBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060606"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="contactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a9e7e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7a9e7e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#contactBg)"/>
  <rect width="1600" height="900" fill="url(#contactGlow)"/>
  <!-- Communication lines -->
  <g opacity="0.05" stroke="#e8e8e8" stroke-width="0.5" fill="none">
    <path d="M200 200 Q800 100 1400 300"/>
    <path d="M200 400 Q800 500 1400 400"/>
    <path d="M200 600 Q800 700 1400 600"/>
  </g>
  <!-- Connection nodes -->
  <g fill="#7a9e7e" opacity="0.2">
    <circle cx="400" cy="300" r="3"/>
    <circle cx="800" cy="450" r="4"/>
    <circle cx="1200" cy="350" r="3"/>
    <circle cx="600" cy="600" r="3"/>
    <circle cx="1000" cy="550" r="3"/>
  </g>
  <rect width="1600" height="900" fill="#000" opacity="0.1"/>
</svg>
