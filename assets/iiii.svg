<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="gvSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e0a"/>
      <stop offset="40%" stop-color="#121a12"/>
      <stop offset="100%" stop-color="#1a241a"/>
    </linearGradient>
    <linearGradient id="gvValley" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a241a"/>
      <stop offset="100%" stop-color="#0a0e0a"/>
    </linearGradient>
    <radialGradient id="gvGlow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#7a9e7e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7a9e7e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#gvSky)"/>
  <rect width="1600" height="900" fill="url(#gvGlow)"/>
  <!-- Valley silhouette layers -->
  <path d="M0 600 Q400 520 800 560 T1600 580 L1600 900 L0 900 Z" fill="url(#gvValley)" opacity="0.6"/>
  <path d="M0 680 Q300 620 600 640 T1200 650 T1600 660 L1600 900 L0 900 Z" fill="url(#gvValley)" opacity="0.8"/>
  <path d="M0 750 Q200 700 500 720 T1000 730 T1600 740 L1600 900 L0 900 Z" fill="#080c08"/>
  <!-- Grid blocks representing puzzle -->
  <g opacity="0.12" stroke="#7a9e7e" stroke-width="1.5" fill="none">
    <rect x="650" y="300" width="80" height="80" rx="4"/>
    <rect x="750" y="300" width="80" height="80" rx="4"/>
    <rect x="850" y="300" width="80" height="80" rx="4"/>
    <rect x="650" y="400" width="80" height="80" rx="4"/>
    <rect x="750" y="400" width="80" height="80" rx="4" fill="#7a9e7e" fill-opacity="0.15"/>
    <rect x="850" y="400" width="80" height="80" rx="4"/>
    <rect x="650" y="500" width="80" height="80" rx="4"/>
    <rect x="850" y="500" width="80" height="80" rx="4"/>
  </g>
  <!-- Accent star -->
  <circle cx="1200" cy="180" r="2" fill="#7a9e7e" opacity="0.6"/>
  <circle cx="300" cy="200" r="1.5" fill="#e8e8e8" opacity="0.3"/>
  <circle cx="900" cy="120" r="1" fill="#e8e8e8" opacity="0.2"/>
  <circle cx="1500" cy="250" r="1.5" fill="#e8e8e8" opacity="0.2"/>
  <!-- Grain overlay -->
  <rect width="1600" height="900" fill="#000" opacity="0.1"/>
</svg>
