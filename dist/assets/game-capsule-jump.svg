<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="cjBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#101014"/>
    </linearGradient>
    <radialGradient id="cjGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a9e7e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7a9e7e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#cjBg)"/>
  <rect width="1600" height="900" fill="url(#cjGlow)"/>
  <!-- Floating capsule shapes -->
  <g opacity="0.7">
    <ellipse cx="400" cy="350" rx="60" ry="120" fill="none" stroke="#2a2a2e" stroke-width="2"/>
    <ellipse cx="400" cy="350" rx="50" ry="100" fill="none" stroke="#3a3a3e" stroke-width="1"/>
    <ellipse cx="800" cy="500" rx="50" ry="90" fill="none" stroke="#2a2a2e" stroke-width="2"/>
    <ellipse cx="800" cy="500" rx="40" ry="75" fill="none" stroke="#3a3a3e" stroke-width="1"/>
    <ellipse cx="1100" cy="300" rx="55" ry="110" fill="none" stroke="#2a2a2e" stroke-width="2"/>
    <ellipse cx="1100" cy="300" rx="45" ry="90" fill="none" stroke="#3a3a3e" stroke-width="1"/>
  </g>
  <!-- Jump trajectory dots -->
  <g fill="#7a9e7e" opacity="0.3">
    <circle cx="500" cy="700" r="3"/>
    <circle cx="550" cy="650" r="3" opacity="0.25"/>
    <circle cx="600" cy="600" r="3" opacity="0.2"/>
    <circle cx="650" cy="560" r="3" opacity="0.15"/>
    <circle cx="700" cy="530" r="3" opacity="0.1"/>
  </g>
  <!-- Platform lines -->
  <rect x="200" y="780" width="200" height="4" fill="#1a1a1e"/>
  <rect x="600" y="730" width="180" height="4" fill="#1a1a1e"/>
  <rect x="1000" y="680" width="160" height="4" fill="#1a1a1e"/>
  <rect x="1300" y="750" width="200" height="4" fill="#1a1a1e"/>
  <!-- Stars -->
  <circle cx="1200" cy="150" r="1.5" fill="#e8e8e8" opacity="0.3"/>
  <circle cx="200" cy="120" r="1" fill="#e8e8e8" opacity="0.2"/>
  <circle cx="600" cy="200" r="1" fill="#e8e8e8" opacity="0.15"/>
  <rect width="1600" height="900" fill="#000" opacity="0.1"/>
</svg>
